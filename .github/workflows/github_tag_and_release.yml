---
name: Release

on:  # yamllint disable-line rule:truthy
  pull_request_target:
    types:
      - closed
    branches:
      - master

jobs:

  tag:
    if: github.event.pull_request.merged
    permissions:
      contents: write
    name: Tag semantic version
    runs-on: ubuntu-22.04
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Tag
        uses: ./.github/actions/semantic-version-tagger
        with:
          semantic-version: v2.0.5
          commit: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: tag
    permissions:
      contents: write
    name: Create GitHub Release
    runs-on: ubuntu-22.04
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      -
        name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
