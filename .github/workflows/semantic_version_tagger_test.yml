---
name: Semantic version tagger tests

on:  # yamllint disable-line rule:truthy
  pull_request:
  push:

jobs:
  semantic-version-spec:
    name: Executable specification
    runs-on: ubuntu-22.04
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run executable specification
        run: npm run test:semantic-version-spec
