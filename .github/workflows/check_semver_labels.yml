---
name: Label Checker
on:  # yamllint disable-line rule:truthy
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

jobs:

  check_semver_label:
    name: Check for semantic version label
    runs-on: ubuntu-22.04
    steps:
      - uses: agilepathway/label-checker@7b9a2f1460924cb4395e3a14ed40aa249cbffc7c  # v2.0.73
        with:
          one_of: major,minor,patch
          repo_token: ${{ secrets.GITHUB_TOKEN }}
