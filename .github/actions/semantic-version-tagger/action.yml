name: Semantic version tagger
description: Creates and updates semantic version Git refs
author: John Boyes
inputs:
  semantic-version:
    description: Semantic version tag to create, for example v2.1.0
    required: true
  commit:
    description: Commit SHA to which the resulting refs should point
    required: true
runs:
  using: node24
  main: src/index.ts
